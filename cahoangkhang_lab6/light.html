<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- code css o day-->
</head>
<body>
    <h2> chuong trinh bat / tat bong den </h2>
    <img id="bulb" src="./bulboff.gif" width="120px" alt="light">
    <br> <br>
    <button onclick="togglelight()"> on / off</button>

    <!--code java o day-->
    <script>
        // viet code js o day
        function togglelight() {
            let toggle = document.getElementById("bulb");
            if (toggle.src.includes("bulboff.gif")) {
                toggle.src = "./bulbon.gif";
            } else {
                toggle.src = "./bulboff.gif";
            }
            
        }
          
    </script>
       
</body>
</html>
