<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
</head>
<body>
    <h2>Chuyển đổi nhiệt độ</h2>
    <label for="doC">Nhập nhiệt độ (°C):</label>
    <input type="number" id="doC" step="any">
    <button onclick="chuyenDoi()">Chuyển đổi</button>
    <p id="ketqua"></p>

    <script>
        function chuyenDoi() {
            let giaTri = document.getElementById("doC").value;
            let doC = Number(giaTri);
            if (giaTri === "" || !Number.isFinite(doC)) {
                document.getElementById("ketqua").textContent = "Vui lòng nhập nhiệt độ hợp lệ.";
                return;
            }

            let doF = (9 / 5) * doC + 32;
            document.getElementById("ketqua").textContent = doC + " °C = " + doF + " °F";
        }
    </script>
</body>
</html>
