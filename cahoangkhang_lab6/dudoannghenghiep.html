<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
</head>
<body>
    <h2>Dự đoán nghề nghiệp</h2>
    <label for="ten">Nhập tên của bạn:</label>
    <input type="text" id="ten">
    <button onclick="duDoan()">Dự đoán nghề nghiệp</button>
    <p id="ketqua"></p>

    <script>
        function duDoan() {
            let ten = document.getElementById("ten").value.trim();
            if (ten === "") {
                document.getElementById("ketqua").textContent = "Vui lòng nhập tên của bạn.";
                return;
            }

            let danhSach = ["Lập trình viên", "Giáo viên", "Bác sĩ", "Kỹ sư", "Đầu bếp"];
            let nghe = danhSach[Math.floor(Math.random() * danhSach.length)];
            document.getElementById("ketqua").textContent = ten + ", nghề nghiệp được dự đoán của bạn là: " + nghe;
        }
    </script>
</body>
</html>
