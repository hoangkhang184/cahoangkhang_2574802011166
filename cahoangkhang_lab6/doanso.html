<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document</title>
</head>
<body>
    <h2> Đoán số may mắn</h2>
    <label for="sodoan">Nhập số từ 1 đến 10:</label>
    <input type="number" id="sodoan" min="1" max="10" step="1">
    <button onclick="doanSo()">Đoán số</button>
    <p id="ketqua"></p>

    <script>
        function doanSo() {
            let giaTri = document.getElementById("sodoan").value;
            let soDoan = Number(giaTri);
            if (giaTri === "" || !Number.isInteger(soDoan) || soDoan < 1 || soDoan > 10) {
                document.getElementById("ketqua").textContent = "Vui lòng nhập số nguyên từ 1 đến 10.";
                return;
            }

            let soMay = Math.floor(Math.random() * 10) + 1;
            if (soDoan === soMay) {
                document.getElementById("ketqua").textContent = "Máy chọn số " + soMay + ". Bạn đã thắng!";
            } else {
                document.getElementById("ketqua").textContent = "Máy chọn số " + soMay + ". Bạn chưa may mắn!";
            }
        }
    </script>
</body>
</html>
